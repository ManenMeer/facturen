.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}

.bl{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:46vh;overflow-y:auto}
.bl button{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;min-height:48px;cursor:pointer}
.bl button:first-child{border-top:0}.bl button:hover{background:var(--cyan-soft)}

   logLines.push("("+(k+1)+"/"+plan.length+") "+t);n++;progress=Math.round(n/total*100);render();
   await sleep(160);
  }
  var i=p.i;
  var mailed=p.acts.some(function(a){return /^Mail aan/.test(a)});
  res.push({file:newName(i),supplier:i.supplier||"(onbekend)",number:i.number||"(onbekend)",kind:destOf(i),
   dest:destFolder(i)||"",mail:mailed?projByName(i.project).email:"",

 }
 S.invoices=S.invoices.filter(function(i){return !(decided(i)&&i.action!=="keep")});

}

var GB="https://graph.microsoft.com/v1.0";
async function gfetch(method,path,body,hdr,raw){
 var url=path.indexOf("http")===0?path:GB+path;
 for(var k=0;k<3;k++){
  var h=Object.assign({Authorization:"Bearer "+await token()},hdr||{});
  var init={method:method,headers:h};
  if(body!==undefined){if(body instanceof Uint8Array||typeof body==="string"){init.body=body}else{h["Content-Type"]="application/json";init.body=JSON.stringify(body)}}
  var r=await fetch(url,init);
  if((r.status===429||r.status===503)&&k<2){await sleep(((+r.headers.get("Retry-After"))||2)*1000);continue}
  if(!r.ok){var t="";try{t=(await r.json()).error.message}catch(e){}var er=new Error(method+" "+r.status+(t?": "+t:""));er.status=r.status;throw er}
  if(raw)return r;
  var ct=r.headers.get("content-type")||"";
  return ct.indexOf("json")>-1?r.json():null;
 }
}
var encPath=function(p){return p.split("/").filter(Boolean).map(encodeURIComponent).join("/")};

async function dlBytes(item){

 if(!u){var it=await gfetch("GET","/me/drive/items/"+item.id);u=it["@microsoft.graph.downloadUrl"]}
 var r=await fetch(u);if(!r.ok)throw new Error("downloaden mislukt ("+r.status+")");

}
async function chunkPut(url,bytes){
 var CH=3276800,pos=0,last=null;
 while(pos<bytes.length){
  var end=Math.min(pos+CH,bytes.length);
  var r=await fetch(url,{method:"PUT",headers:{"Content-Range":"bytes "+pos+"-"+(end-1)+"/"+bytes.length},body:bytes.subarray(pos,end)});
  if(!r.ok&&r.status!==202)throw new Error("uploaden mislukt ("+r.status+")");
  last=r;pos=end;
 }
 return last;
}
async function uploadTo(base,bytes,ctype){
 /* base: "/me/drive/items/ID" of "/me/drive/root:/pad/naam" */
 var isItem=base.indexOf("/items/")>-1;
 if(bytes.length<3500000)return gfetch("PUT",base+(isItem?"/content":":/content"),bytes,{"Content-Type":ctype||"application/octet-stream"});
 var ses=await gfetch("POST",base+(isItem?"/createUploadSession":":/createUploadSession"),{item:{"@microsoft.graph.conflictBehavior":"replace"}});
 return chunkPut(ses.uploadUrl,bytes);
}

/* ---- csv ---- */
function csvRows(t){
 var rows=[],row=[],f="",q=false;t=t.replace(/^﻿/,"");
 for(var k=0;k<t.length;k++){var c=t[k];
  if(q){if(c==='"'){if(t[k+1]==='"'){f+='"';k++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===","){row.push(f);f=""}
  else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
  else if(c!=="\r")f+=c;
 }
 if(f!==""||row.length){row.push(f);rows.push(row)}
 return rows;
}
function parseCsv(t){return csvRows(t).slice(1).filter(function(r){return r.length>6}).map(function(r){return {date:r[0],number:r[4],supplier:r[5],dest:r[6],file:r[2]||r[1]}})}
var csvq=function(x){x=String(x==null?"":x);return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
async function appendDb(rows){
 var name=S.test?"facturen_database_TEST.csv":"facturen_database.csv",path=DBDIR+"/"+name;
 var header="Datum verwerkt,Origineel bestand,Nieuw bestand,Factuurdatum,Factuurnummer,Leverancier,Bestemming,Opmerkingen";
 var it=await tryItem(path),txt=header,bom=false;
 if(it){var by=await dlBytes(it);bom=by[0]===0xEF&&by[1]===0xBB&&by[2]===0xBF;txt=new TextDecoder().decode(by).replace(/^﻿/,"")}
 var eol=txt.indexOf("\r\n")>-1?"\r\n":"\n";
 if(!/\n$/.test(txt))txt+=eol;
 txt+=rows.map(function(r){return r.map(csvq).join(",")}).join(eol)+eol;
 var enc=new TextEncoder().encode(txt);
 if(bom){var o=new Uint8Array(enc.length+3);o.set([0xEF,0xBB,0xBF]);o.set(enc,3);enc=o}
 await uploadTo(rp(path),enc,"text/csv");
}

function wrapText(text,font,size,maxW){
 var out=[];
 String(text).split(/\r?\n/).forEach(function(par){
  var words=par.split(/\s+/).filter(Boolean),line="";
  if(!words.length){out.push("");return}
  words.forEach(function(w){var t=line?line+" "+w:w;if(!line||font.widthOfTextAtSize(t,size)<=maxW)line=t;else{out.push(line);line=w}});
  out.push(line);
 });
 return out;
}

 var nt=String(i.note||"").trim();
 if(nt){
  nt=nt.replace(/[\u2013\u2014]/g,"-").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[^\x20-\x7E\xA0-\xFF€\n\r]/g,"?");
  var nf=await doc.embedFont(P.StandardFonts.Helvetica),ns=0.024*W,nw=0.42*W,pd=0.014*W,lh=ns*1.3;
  var lines=wrapText(nt,nf,ns,nw-2*pd),nh=lines.length*lh+2*pd;
  var np=i.notePos||(i.stamp?{x:i.stamp.x,y:Math.min(i.stamp.y+11,88)}:{x:5,y:3});
  var nx=mb.x+np.x/100*W,ny=mb.y+H-np.y/100*H-nh;
  page.drawRectangle({x:nx,y:ny,width:nw,height:nh,color:white,opacity:0.7,borderColor:cyan,borderWidth:0.003*W,borderDashArray:[0.01*W,0.008*W]});
  lines.forEach(function(l,k){page.drawText(l,{x:nx+pd,y:ny+nh-pd-ns*0.95-k*lh,size:ns,font:nf,color:dark})});
 }
 return await doc.save();
}

/* ---- mail ---- */
function addrs(x){return String(x||"").split(/[,;\s]+/).filter(function(a){return /@/.test(a)}).map(function(a){return {emailAddress:{address:a}}})}
function b64(u8){var s="",CH=0x8000;for(var k=0;k<u8.length;k+=CH)s+=String.fromCharCode.apply(null,u8.subarray(k,k+CH));return btoa(s)}
async function sendMail(to,subject,body,fname,bytes){
 var msg={subject:subject,body:{contentType:"Text",content:body},toRecipients:addrs(to)};
 if(!msg.toRecipients.length)throw new Error("geen geldig mailadres bij het project");
 if(S.cc&&addrs(S.cc).length)msg.ccRecipients=addrs(S.cc);
 if(bytes.length<2500000){
  msg.attachments=[{"@odata.type":"#microsoft.graph.fileAttachment",name:fname,contentType:"application/pdf",contentBytes:b64(bytes)}];
  await gfetch("POST","/me/sendMail",{message:msg,saveToSentItems:true});return;
 }
 var d=await gfetch("POST","/me/messages",msg);
 var ses=await gfetch("POST","/me/messages/"+d.id+"/attachments/createUploadSession",{AttachmentItem:{attachmentType:"file",name:fname,size:bytes.length,contentType:"application/pdf"}});
 await chunkPut(ses.uploadUrl,bytes);
 await gfetch("POST","/me/messages/"+d.id+"/send");
}

/* ---- alles uitvoeren (echt) ---- */
async function liveRun(){
 running=true;logLines=[];progress=0;S.step="finish";render();
 var plan=planRows().filter(function(p){return !p.pending&&p.i.action!=="keep"}),res=[],dbRows=[],okSet={},n=0,testRoot=S.boxin+"/_test uitgevoerd";
 var log=function(t){logLines.push(t);render()};
 for(var k=0;k<plan.length;k++){
  var p=plan[k],i=p.i,name=newName(i),row={file:name,supplier:i.supplier||"(onbekend)",number:i.number||"(onbekend)",kind:destOf(i),dest:"",mail:"",adm:false,ok:false,status:""},mailSent=false;
  progress=Math.round(k/plan.length*100);
  try{
   log("("+(k+1)+"/"+plan.length+") "+i.orig+" → "+name);
   var dpath=destFolder(i);
   if(!dpath)throw new Error("geen mapadres ingevuld voor "+destOf(i));
   var tfolder=S.test?testRoot+"/"+clean(destOf(i)):dpath,target;
   if(S.test)target=await ensureFolder(tfolder);
   else if(i.action!=="process")target=await ensureFolder(dpath);
   else{target=await tryItem(dpath);if(!target||!target.folder)throw new Error("map niet gevonden: "+dpath)}
   var bytes=pdfData[i.id],stamped=false;
   if(i.action==="process"){log("Stempel plaatsen…");bytes=await stampPdf(i);stamped=true}
   var pr=projByName(i.project);
   if(p.acts.some(function(a){return /^Mail aan/.test(a)})){
    var m=mailFor(i);log("Mail versturen aan "+pr.email+"…");
    await sendMail(pr.email,m.subject,m.body,name,bytes);mailSent=true;row.mail=pr.email;
   }
   if(S.test){log("Kopie naar de testmap…");await uploadTo(rp(tfolder+"/"+name),bytes,"application/pdf")}
   else{
    if(stamped){log("Gestempelde pdf opslaan…");await uploadTo("/me/drive/items/"+i.itemId,bytes,"application/pdf")}
    log("Hernoemen en verplaatsen…");
    await gfetch("PATCH","/me/drive/items/"+i.itemId,{name:name,parentReference:{id:target.id},"@microsoft.graph.conflictBehavior":"rename"});
   }
   row.dest=tfolder;row.adm=!!(i.adm&&i.action==="process"&&p.acts.some(function(a){return /^Noteren/.test(a)}));row.ok=true;row.status="gelukt";okSet[i.id]=1;
   if(i.action!=="duplicate")dbRows.push([todayISO,i.orig,name,i.date,i.number,i.supplier,destOf(i),(S.test?"TEST via app; ":"via app; ")+"uit map box in"+(row.adm?"; administratie bijwerken: voorstel nodig":"")+(i.note?"; extra tekst op factuur: "+i.note:"")]);
  }catch(e){
   row.status=mailSent?"Mail is verstuurd, maar bestand niet verplaatst: "+e.message:"MISLUKT, niet verwerkt: "+e.message;
  }
  res.push(row);
 }
 var dbErr="";
 if(dbRows.length){try{log("Database bijwerken…");await appendDb(dbRows)}catch(e){dbErr="Database niet bijgewerkt: "+e.message}}
 if(!S.test)S.invoices=S.invoices.filter(function(x){return !okSet[x.id]});
 var errs=res.filter(function(r){return !r.ok}).length+(dbErr?1:0);
 if(dbErr)res.push({file:"(database)",supplier:"",number:"",kind:"",dest:"",mail:"",adm:false,ok:false,status:dbErr});
 S.cur=0;S.done=true;S.result={rows:res,left:S.invoices.length,date:todayDMY,live:true,test:S.test,errors:errs};
 running=false;save();render();
}

render();initDb();msalInit();
})();
